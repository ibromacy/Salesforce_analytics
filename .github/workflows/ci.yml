name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    name: dbt build + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dbt Fusion
        run: |
          curl -fsSL https://dbt.com/install.sh | bash
          echo "$HOME/.dbt-fusion/bin" >> $GITHUB_PATH

      - name: Authenticate with GCP
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp_keyfile.json

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          salesforce_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: salesforce-analytics-489817
                dataset: ci_salesforce
                location: EU
                keyfile: /tmp/gcp_keyfile.json
                threads: 4
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt build
        run: dbt build

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/gcp_keyfile.json