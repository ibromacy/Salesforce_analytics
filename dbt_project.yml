name: salesforce_analytics

profile: salesforce_analytics

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  salesforce_analytics:
    +schema: raw

# models:
#   salesforce_analytics:
#     # Materialize staging models as views, and marts as tables
#     staging:
#       +materialized: view
#     marts:
#       +materialized: table

models:
  salesforce_analytics:
    staging:
      +materialized: view
      +schema: staging_salesforce
    marts:
      sales:
        +materialized: table
        +schema: marts_sales
      marketing:
        +materialized: table
        +schema: marts_marketing
      customer:
        +materialized: table
        +schema: marts_customer
      dimensions:
        +materialized: table
        +schema: marts_dimensions

snapshots:
  salesforce_analytics:
    +schema: snapshots_salesforce
