version: 2

models:
  - name: stg_accounts
    description: Cleaned Salesforce accounts - one row per account
    columns:
      - name: account_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_contacts
    description: Cleaned Salesforce contacts - one row per contact
    columns:
      - name: contact_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: account_id
        description: Foreign key to stg_accounts
        tests:
          - relationships:
             arguments:
              to: ref('stg_accounts')
              field: account_id

  - name: stg_leads
    description: Cleaned Salesforce leads - one row per lead
    columns:
      - name: lead_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_opportunities
    description: Cleaned Salesforce opportunities - one row per opportunity
    columns:
      - name: opportunity_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: account_id
        description: Foreign key to stg_accounts
        tests:
          - relationships:
             arguments:
              to: ref('stg_accounts')
              field: account_id

  - name: stg_opportunity_stages
    description: Salesforce opportunity stage definitions
    columns:
      - name: stage_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_tasks
    description: Cleaned Salesforce tasks - one row per task
    columns:
      - name: task_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_users
    description: Cleaned Salesforce users - one row per active user
    columns:
      - name: user_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_campaigns
    description: Cleaned Salesforce campaigns - one row per campaign
    columns:
      - name: campaign_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_campaign_members
    description: Cleaned Salesforce campaign members - one row per member
    columns:
      - name: campaign_member_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: campaign_id
        description: Foreign key to stg_campaigns
        tests:
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id

  - name: stg_opportunity_line_items
    description: Cleaned Salesforce opportunity line items - one row per product per deal
    columns:
      - name: line_item_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: opportunity_id
        description: Foreign key to stg_opportunities
        tests:
          - relationships:
              arguments:
                to: ref('stg_opportunities')
                field: opportunity_id
      - name: total_price
        description: Line item total (quantity x unit price)
        tests:
          - not_null