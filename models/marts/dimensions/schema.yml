version: 2

models:
  - name: dim_date
    description: Standard date dimension with calendar and fiscal attributes
    columns:
      - name: date_day
        description: Primary key - calendar date
        tests:
          - unique
          - not_null

  - name: dim_account
    description: Account dimension with SCD Type 2 history
    columns:
      - name: account_key
        description: Surrogate key (account_id + valid_from)
        tests:
          - unique
          - not_null
      - name: account_id
        description: Natural key from Salesforce
        tests:
          - not_null

  - name: dim_user
    description: Sales rep dimension with SCD Type 2 history
    columns:
      - name: user_key
        description: Surrogate key (user_id + valid_from)
        tests:
          - unique
          - not_null
      - name: user_id
        description: Natural key from Salesforce
        tests:
          - not_null

  - name: dim_lead
    description: Lead dimension - one row per lead
    columns:
      - name: lead_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: dim_opportunity_stage
    description: Pipeline stage reference dimension
    columns:
      - name: stage_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: dim_campaign
    description: Marketing campaign dimension
    columns:
      - name: campaign_id
        description: Primary key
        tests:
          - unique
          - not_null