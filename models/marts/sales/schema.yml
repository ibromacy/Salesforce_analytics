version: 2

models:
  - name: fct_opportunities
    description: Core sales pipeline fact - one row per opportunity
    columns:
      - name: opportunity_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: deal_status
        description: Derived status - Won, Lost, or Open
        tests:
          - accepted_values:
              arguments:
                values: ['Won', 'Lost', 'Open']
      - name: won_revenue
        description: Revenue from won deals only
      - name: lost_revenue
        description: Revenue from lost deals only

  - name: fct_sales_activities
    description: Sales activity tracking - one row per task
    columns:
      - name: task_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: fct_sales_performance
    description: Aggregated sales metrics per rep
    columns:
      - name: owner_id
        description: Primary key - sales rep ID
        tests:
          - unique
          - not_null
      - name: win_rate
        description: Won deals / closed deals
      - name: total_won_revenue
        description: Total revenue from won deals

  - name: fct_product_performance
    description: Product-level sales analysis - one row per line item
    columns:
      - name: line_item_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: opportunity_id
        description: Foreign key to fct_opportunities
        tests:
          - relationships:
              arguments:
                to: ref('fct_opportunities')
                field: opportunity_id
      - name: total_price
        description: Line item total price
        tests:
          - not_null